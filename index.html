<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Akasora POS Madu Akasia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 antialiased h-[100dvh] flex items-center justify-center p-4 relative overflow-hidden select-none">

  <!-- Efek Cahaya Latar Belakang -->
  <div class="absolute w-80 h-80 bg-amber-500/15 rounded-full blur-3xl -top-10 -left-10 pointer-events-none"></div>
  <div class="absolute w-80 h-80 bg-amber-700/15 rounded-full blur-3xl -bottom-10 -right-10 pointer-events-none"></div>

  <!-- Kartu Login Modern -->
  <div class="relative w-full max-w-sm bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
    
    <!-- Header Logo Brand -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-slate-950 shadow-xl shadow-amber-500/20 mb-3">
        <i data-lucide="droplet" class="w-7 h-7 fill-slate-950"></i>
      </div>
      <h1 class="text-xl font-black tracking-wide text-white">AKASORA POS</h1>
      <p class="text-xs text-amber-400 font-semibold uppercase tracking-wider mt-0.5">Madu Akasia Riau</p>
    </div>

    <!-- Alert Notifikasi Error -->
    <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span id="login-error-msg">Username atau Password salah!</span>
    </div>

    <!-- Form Login Utama -->
    <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-slate-300 mb-1.5 uppercase text-[10px] tracking-wider">Username</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input type="text" id="username" required placeholder="admin / kasir" autocomplete="off"
            class="w-full bg-slate-800/80 border border-slate-700 text-white rounded-xl pl-10 pr-4 py-2.5 focus:border-amber-500 focus:bg-slate-800 focus:outline-none transition">
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-300 mb-1.5 uppercase text-[10px] tracking-wider">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input type="password" id="password" required placeholder="Masukkan password"
            class="w-full bg-slate-800/80 border border-slate-700 text-white rounded-xl pl-10 pr-10 py-2.5 focus:border-amber-500 focus:bg-slate-800 focus:outline-none transition">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button type="submit" 
        class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow-lg shadow-amber-600/30 transition active:scale-95 flex items-center justify-center gap-2 mt-2 text-xs">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Masuk ke Aplikasi</span>
      </button>
    </form>

    <!-- Tombol Akses Cepat (Testing) -->
    <div class="mt-6 pt-5 border-t border-slate-800 text-center">
      <p class="text-[10px] font-semibold text-slate-400 mb-2.5">Akses Uji Coba Cepat:</p>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="quickFill('admin', 'admin123')" 
          class="py-2 px-3 bg-slate-800 hover:bg-slate-700/80 text-amber-300 rounded-xl text-[11px] font-bold border border-amber-500/20 transition flex items-center justify-center gap-1.5">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
          <span>Admin</span>
        </button>
        <button onclick="quickFill('kasir', 'kasir123')" 
          class="py-2 px-3 bg-slate-800 hover:bg-slate-700/80 text-slate-200 rounded-xl text-[11px] font-bold border border-slate-700 transition flex items-center justify-center gap-1.5">
          <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
          <span>Kasir</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    // Data Akun Login (Bisa disesuaikan sandinya di sini)
    const USER_DATABASE = {
      "admin": { password: "admin123", role: "admin", redirect: "admin.html", name: "Administrator" },
      "kasir": { password: "kasir123", role: "user", redirect: "user.html", name: "Staff Kasir" }
    };

    function togglePasswordVisibility() {
      const passInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eye-icon");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeIcon.setAttribute("data-lucide", "eye-off");
      } else {
        passInput.type = "password";
        eyeIcon.setAttribute("data-lucide", "eye");
      }
      lucide.createIcons();
    }

    function quickFill(user, pass) {
      document.getElementById("username").value = user;
      document.getElementById("password").value = pass;
      handleLogin(new Event("submit"));
    }

    function handleLogin(e) {
      if (e) e.preventDefault();
      const u = document.getElementById("username").value.trim().toLowerCase();
      const p = document.getElementById("password").value.trim();
      const errorBox = document.getElementById("login-error");

      const targetUser = USER_DATABASE[u];

      if (targetUser && targetUser.password === p) {
        errorBox.classList.add("hidden");

        // Simpan token sesi login di browser
        localStorage.setItem("akasora_session", JSON.stringify({
          username: u,
          role: targetUser.role,
          name: targetUser.name,
          loggedInAt: new Date().toISOString()
        }));

        // Arahkan ke halaman sesuai peran
        window.location.href = targetUser.redirect;
      } else {
        errorBox.classList.remove("hidden");
      }
    }

    lucide.createIcons();
  </script>
</body>
</html>
